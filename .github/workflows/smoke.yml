name: Smoke
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_policy.py tests/test_decision_pipeline.py tests/test_tv_robust_allocation.py tests/test_heldout_policy_gate.py
